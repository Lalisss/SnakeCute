<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake Love</title>
<style>
  :root { --pink: #ea80b0; --bg: #0a0008; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #hud { width: var(--w, 360px); display: flex; justify-content: space-between; align-items: center;
    color: var(--pink); font-size: 1.1rem; text-shadow: 0 0 10px #fff3; }
  #wrap { position: relative; }
  canvas { display: block; background: var(--bg); border-radius: 14px;
    box-shadow: 0 0 30px #ea80b055, inset 0 0 0 1px #ea80b044; }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: 90%;
    background: #000a; border: 1px solid #ea80b077; color: #ffd3e6; padding: 8px 14px; border-radius: 999px;
    font-size: .95rem; text-align: center; opacity: 0; transition: opacity .35s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 20px; gap: 14px; border-radius: 14px;
    background: #000c; }
  .overlay.show { display: flex; }
  .overlay h1 { margin: 0; color: var(--pink); font-size: 1.6rem; text-shadow: 0 0 14px #fff4; }
  .overlay p { margin: 0; color: #ffd3e6; line-height: 1.5; }
  button { background: var(--pink); color: #2a0016; border: 0; border-radius: 999px; padding: 10px 26px;
    font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 18px #ea80b088; }
  button:active { transform: scale(.96); }
  #win { background: #000e; overflow: hidden; }
  #win > *:not(#flow) { position: relative; z-index: 2; }
  #flow { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #flow span { position: absolute; left: 0; top: 0; color: var(--pink); font-family: "Courier New", monospace;
    white-space: nowrap; letter-spacing: 2px; text-shadow: 0 0 10px #fff; transform-origin: 50% 50%; }
  #hint { color: #ea80b099; font-size: .8rem; }
</style>
</head>
<body>
<div id="hud"><span id="score">♥ 0 / 10</span><span id="hint">ปัดนิ้ว หรือกดลูกศร</span></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="toast"></div>

  <div class="overlay show" id="start">
    <h1>Snake Love</h1>
    <p id="startText"></p>
    <button id="startBtn">เริ่มเล่น</button>
  </div>

  <div class="overlay" id="lose">
    <h1>อ๊ะ ชนซะแล้ว</h1>
    <p id="loseText"></p>
    <button id="retryBtn">เล่นใหม่</button>
  </div>

  <div class="overlay" id="win">
    <div id="flow"></div>
    <h1 id="winTitle"></h1>
    <p id="winText"></p>
    <button id="againBtn">เล่นอีกรอบ</button>
  </div>
</div>

<script>
/* ============ แก้ข้อความตรงนี้ได้เลย ============ */
const CONFIG = {
  name: "",                 // ใส่ชื่อแฟนได้ เช่น "ที่รัก"
  goal: 10,                 // ต้องเก็บหัวใจกี่ดวงถึงจะเจอเซอร์ไพรส์
  speedMs: 230,             // ยิ่งเลขมาก งูยิ่งช้า
  startText: "กินหัวใจให้ครบ 10 ดวง แล้วมีเซอร์ไพรส์รออยู่นะ",
  messages: [               // เหตุผลที่รักเธอ: สุ่มเด้งทุกครั้งที่กินหัวใจ (ใส่กี่ข้อก็ได้)
    "เธอทำให้ฉันยิ้มได้ทุกวัน",
    "เธอใจดีกับทุกคน",
    "รอยยิ้มของเธอน่ารักที่สุด",
    "อยู่กับเธอแล้วสบายใจ",
    "เธอฟังฉันเสมอ",
    "เธอทำให้เรื่องธรรมดาพิเศษขึ้น",
    "ขอบคุณที่อยู่ข้างกัน",
    "ทุกวันกับเธอเป็นวันที่ดี",
    "เธอคือคนที่ฉันอยากเจอเป็นคนแรก",
    "ก็เพราะเธอคือเธอ"
  ],
  lose: [
    "ไม่เป็นไรนะ ลองใหม่อีกที เก่งอยู่แล้ว",
    "ชนก็น่ารักเหมือนกัน ไปต่อกัน!",
    "พักหายใจแป๊บ แล้วเล่นต่อได้เลย"
  ],
  winTitle: "เก่งมาก! ครบแล้ว",
  winText: "วันนี้มีเซอร์ไพรส์ให้เธอนะ\nรักเธอที่สุดเลย",
  flowWord: "love you"
};
/* ================================================= */

const N = 20;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
let cell, snake, dir, queue, heart, score, timer, running = false;

function resize() {
  const size = Math.floor(Math.min(innerWidth * 0.94, innerHeight - 110, 560) / N) * N;
  cell = size / N;
  const dpr = devicePixelRatio || 1;
  canvas.width = canvas.height = size * dpr;
  canvas.style.width = canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  document.documentElement.style.setProperty('--w', size + 'px');
  $('win').style.width = $('lose').style.width = $('start').style.width = size + 'px';
  draw();
}

function reset() {
  snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
  dir = {x: 1, y: 0}; queue = [];
  score = 0; bag = []; updateScore(); placeHeart();
}
function updateScore() { $('score').textContent = `♥ ${score} / ${CONFIG.goal}`; }
function placeHeart() {
  do { heart = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)}; }
  while (snake.some(s => s.x === heart.x && s.y === heart.y));
}

let bag = [];
function nextMessage() {            // random, no repeats until every message has been shown
  if (!bag.length) {
    bag = CONFIG.messages.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  }
  return CONFIG.messages[bag.pop()];
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('show'), 2200);
}

function step() {
  if (queue.length) dir = queue.shift();
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return lose();
  snake.unshift(head);
  if (head.x === heart.x && head.y === heart.y) {
    score++; updateScore();
    toast('♥ ' + nextMessage());
    if (score >= CONFIG.goal) return win();
    placeHeart();
  } else snake.pop();
  draw();
}

function start() {
  ['start', 'lose', 'win'].forEach(id => $(id).classList.remove('show'));
  reset(); running = true; clearInterval(timer);
  timer = setInterval(step, CONFIG.speedMs); draw();
}
function stop() { running = false; clearInterval(timer); }
function lose() {
  stop(); draw();
  $('loseText').textContent = CONFIG.lose[Math.floor(Math.random() * CONFIG.lose.length)];
  $('lose').classList.add('show');
}
function win() {
  stop(); draw();
  $('winTitle').textContent = CONFIG.name ? `${CONFIG.winTitle} ${CONFIG.name}` : CONFIG.winTitle;
  $('winText').innerHTML = CONFIG.winText.replace(/\n/g, '<br>');
  setTimeout(() => { $('win').classList.add('show'); startFlow(); }, 400);
}

/* ---------- drawing ---------- */
function heartPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = i / 60 * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    const px = cx + x * r / 17, py = cy + (y + 1) * r / 17;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function draw() {
  if (!ctx || !cell) return;
  const size = cell * N;
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#ea80b01c';
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    ctx.beginPath(); ctx.arc((x + .5) * cell, (y + .5) * cell, 1.2, 0, 7); ctx.fill();
  }
  if (!snake) return;
  // heart food (pulses)
  const pulse = 1 + Math.sin(performance.now() / 180) * 0.08;
  ctx.save();
  ctx.shadowColor = '#ff4f9a'; ctx.shadowBlur = 16; ctx.fillStyle = '#ff5c9e';
  heartPath((heart.x + .5) * cell, (heart.y + .5) * cell, cell * 0.46 * pulse * 2);
  ctx.fill(); ctx.restore();
  // snake: glowing pink balls, tail thinner
  ctx.save(); ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
  for (let i = snake.length - 1; i >= 0; i--) {
    const s = snake[i], k = 1 - (i / (snake.length + 6)) * 0.35;
    ctx.fillStyle = i === 0 ? '#ffc2dc' : '#ea80b0';
    ctx.beginPath();
    ctx.arc((s.x + .5) * cell, (s.y + .5) * cell, cell * 0.42 * k, 0, 7);
    ctx.fill();
  }
  ctx.restore();
  // eyes
  const h = snake[0], ex = dir.y ? 0.2 : 0, ey = dir.x ? 0.2 : 0;
  ctx.fillStyle = '#2a0016';
  [-1, 1].forEach(sg => {
    ctx.beginPath();
    ctx.arc((h.x + .5 + dir.x * .15 + sg * ex) * cell, (h.y + .5 + dir.y * .15 + sg * ey) * cell, cell * 0.07, 0, 7);
    ctx.fill();
  });
}
(function loop() { if (running) draw(); requestAnimationFrame(loop); })();

/* ---------- controls ---------- */
function turn(nx, ny) {
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (nx === -last.x && ny === -last.y) return;
  if (nx === last.x && ny === last.y) return;
  if (queue.length < 2) queue.push({x: nx, y: ny});
}
addEventListener('keydown', e => {
  const m = {ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0]}[e.key];
  if (m && running) { e.preventDefault(); turn(m[0], m[1]); }
});
let tx, ty;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive: true});
addEventListener('touchmove', e => {
  if (!running || tx == null) return;
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
}, {passive: true});

/* ---------- win: "love you" words flowing around a heart ---------- */
let flowRaf;
function startFlow() {
  const box = $('flow'); box.innerHTML = '';
  const w = box.clientWidth, h = box.clientHeight, S = Math.min(w, h) * 0.8 / 34;
  const fs = Math.max(10, Math.min(w, h) * 0.04);
  const pt = t => [16*Math.pow(Math.sin(t),3), -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
  const M = 1000, pts = [], cum = [0];
  for (let k = 0; k <= M; k++) {
    const p = pt(k / M * Math.PI * 2); pts.push([p[0]*S, p[1]*S]);
    if (k) cum.push(cum[k-1] + Math.hypot(pts[k][0]-pts[k-1][0], pts[k][1]-pts[k-1][1]));
  }
  const total = cum[M], count = Math.round(total / (fs * 5.2));
  const spans = [];
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span'); s.textContent = CONFIG.flowWord; s.style.fontSize = fs + 'px';
    box.appendChild(s); spans.push(s);
  }
  const at = s => {
    s = ((s % total) + total) % total; let lo = 0, hi = M;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m + 1; else hi = m; }
    return lo;
  };
  cancelAnimationFrame(flowRaf);
  (function f(ms) {
    const off = ms / 1000 * Math.min(w, h) * 0.12;
    spans.forEach((sp, i) => {
      const a = at(i / count * total + off), b = at(i / count * total + off + 4);
      const ang = Math.atan2(pts[b][1] - pts[a][1], pts[b][0] - pts[a][0]) * 180 / Math.PI;
      sp.style.transform = `translate(${w/2 + pts[a][0]}px, ${h/2 + pts[a][1]}px) translate(-50%,-50%) rotate(${ang}deg)`;
    });
    flowRaf = requestAnimationFrame(f);
  })(performance.now());
}

/* ---------- boot ---------- */
$('startText').textContent = CONFIG.startText;
$('startBtn').onclick = $('retryBtn').onclick = $('againBtn').onclick = start;
addEventListener('resize', resize);
reset(); resize();
</script>
</body>
</html>
